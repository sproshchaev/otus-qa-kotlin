# Enable parallel test execution
junit.jupiter.execution.parallel.enabled=true

# Test methods within the same class execute in the same thread by default
junit.jupiter.execution.parallel.mode.default=same_thread

# Test classes execute concurrently by default
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Use fixed thread pool strategy
junit.jupiter.execution.parallel.config.strategy=fixed

# Number of parallel threads to use
junit.jupiter.execution.parallel.config.fixed.parallelism=2

# Default timeout for each test method (in milliseconds)
junit.jupiter.execution.timeout.default=100ms